<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spam Message Checker</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        textarea {
            width: 100%;
            height: 120px;
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            resize: none;
            box-sizing: border-box;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }

        #result {
            margin-top: 20px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }

        .spam {
            color: #dc3545;
        }

        .ham {
            color: #28a745;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Spam Checker</h2>
        <textarea id="messageInput" placeholder="Yahan apna text ya message type karein..."></textarea>
        <button onclick="checkSpam()">Check for Spam</button>
        <div id="result"></div>
    </div>

    <script>
        // Ye function tab chalega jab button click hoga
        function checkSpam() {
            const message = document.getElementById('messageInput').value;
            const resultDiv = document.getElementById('result');

            if (message.trim() === "") {
                resultDiv.innerHTML = "<span style='color: orange;'>Please enter a message to check!</span>";
                return;
            }

            resultDiv.innerHTML = "Checking message...";

            /* 
             * ASAL BACKEND CONNECTION KE LIYE (Jab aapka Python API ready ho):
             * 
             * fetch('http://localhost:5000/api/check', {
             *     method: 'POST',
             *     headers: { 'Content-Type': 'application/json' },
             *     body: JSON.stringify({ text: message })
             * })
             * .then(response => response.json())
             * .then(data => {
             *     // yahan backend ka result show karein
             * })
             */

            // Demo ke liye frontend mein hi ek chhota logic lagaya hai:
            setTimeout(() => {
                const lowerMsg = message.toLowerCase();
                // Kuch common spam words
                if (lowerMsg.includes('lottery') || lowerMsg.includes('free money') || lowerMsg.includes('click here') || lowerMsg.includes('winner')) {
                    resultDiv.innerHTML = "<span class='spam'>🚨 Alert: This message looks like SPAM!</span>";
                } else {
                    resultDiv.innerHTML = "<span class='ham'>✅ Safe: This message seems okay.</span>";
                }
            }, 1000); // 1 second ka loading effect
        }
    </script>

</body>

</html>
